name: PR Code Quality

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.14
      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.x"
      - name: Install dependencies
        run: |
          uv sync --group lint
      - name: Run linting
        run: |
          make lint
      - name: Check formatting
        run: |
          uv run --group lint ruff format --diff wrench tests
      - name: Add spellcheck
        run: |
          make spell_check
      - name: Type checking
        run: |
          make lint_types
